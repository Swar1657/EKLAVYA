services:
  postgres:
    image: postgres:15
    container_name: eklavya-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-eklavya}
      POSTGRES_USER: ${POSTGRES_USER:-eklavya}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eklavya_dev_password}
    ports:
      - "0.0.0.0:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
